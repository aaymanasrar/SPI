<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELV Building Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: full-bleed 3D stage with a docked rail; the rail drops below on phones. */
:root{
  --bg:#eceae5; --surface:#f8f7f4; --surface-2:#e4e1da; --fg:#1d2024; --muted:#5d656e;
  --line:#cdc9c0; --accent:#1d4e89; --accent-ink:#ffffff;
  --scene-bg:#dfdcd5; --scene-floor:#d4d0c7; --scene-wall:#8d9299; --scene-slab:#b8b3a8;
  --sys-fire:#c62d24; --sys-cctv:#b8700b; --sys-acs:#2f6fd0; --sys-data:#1b8c62;
  --sys-pa:#7a4fc2; --sys-int:#b0407e; --sys-other:#6b7480;
  --ok:#2c8a4b; --warn:#b3711a; --bad:#c23b2f; --smoke:#6d6a66; --sky:#cfe0ee;
  --f-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --surface-2:#262b30; --fg:#e7e9ec; --muted:#9aa3ad;
  --line:#343b42; --accent:#6fa8dc; --accent-ink:#0d1114;
  --scene-bg:#101417; --scene-floor:#262d33; --scene-wall:#5d6872; --scene-slab:#3a434b;
  --sys-fire:#ef5a50; --sys-cctv:#e0a33c; --sys-acs:#6b9fe8; --sys-data:#3cbd8c;
  --sys-pa:#a98ae6; --sys-int:#e07ab4; --sys-other:#98a1ab;
  --ok:#4cc77a; --warn:#e3a14c; --bad:#f06b5f; --smoke:#a7a39d; --sky:#1b2733; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --surface-2:#262b30; --fg:#e7e9ec; --muted:#9aa3ad;
  --line:#343b42; --accent:#6fa8dc; --accent-ink:#0d1114;
  --scene-bg:#101417; --scene-floor:#262d33; --scene-wall:#5d6872; --scene-slab:#3a434b;
  --sys-fire:#ef5a50; --sys-cctv:#e0a33c; --sys-acs:#6b9fe8; --sys-data:#3cbd8c;
  --sys-pa:#a98ae6; --sys-int:#e07ab4; --sys-other:#98a1ab;
  --ok:#4cc77a; --warn:#e3a14c; --bad:#f06b5f; --smoke:#a7a39d; --sky:#1b2733; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);
  display:grid;grid-template-columns:minmax(0,1fr) 384px;height:100vh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.mono{font-family:var(--f-mono)}

/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden;background:var(--scene-bg);touch-action:none;min-height:0}
#canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rlabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font:500 11px/1.2 var(--f-body);color:var(--fg);background:color-mix(in srgb,var(--surface) 80%,transparent);
  padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.rlabel b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-right:4px}
.rlabel .pct{margin-left:5px;font-family:var(--f-mono);unicode-bidi:isolate}

#hud{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#hud > *{pointer-events:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:2px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip select{border:none;background:transparent;padding:5px 6px;max-width:190px}
.seg{border:none;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg:hover{color:var(--fg);background:var(--surface-2)}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.title{font:600 15px/1.2 var(--f-display);padding:6px 10px}
.pill{font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:999px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.03em}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}

#walkHint,#placeHint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted);display:none}
#legendCov{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;display:none;max-width:min(360px,calc(100% - 24px))}
#legendCov .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
#legendCov .sw:first-child{margin-left:0}
#drillBar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;gap:6px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#drillClock{font:500 15px/1 var(--f-mono);min-width:70px;text-align:center}
#toast{position:absolute;right:12px;bottom:12px;max-width:min(420px,calc(100% - 24px));background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:13px;
  opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#dropHint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);font:600 16px var(--f-display)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
#empty code{font-family:var(--f-mono);background:var(--surface-2);padding:2px 6px;border-radius:4px;color:var(--fg)}

/* ---------- rail ---------- */
#rail{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.sec{border-bottom:1px solid var(--line);padding:14px 16px}
.sec h2{font:600 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.sec h3{font:600 13px/1.3 var(--f-body);margin:12px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.note.warn{color:var(--warn)} .note.bad{color:var(--bad)}
.banner{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--fg);
  border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.banner.info{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 11px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.sw-dot{width:10px;height:10px;border-radius:50%;flex:none}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.field{display:grid;grid-template-columns:1fr 110px;gap:4px 10px;align-items:center;font-size:12.5px;margin:6px 0}
.field input,.field select{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.field input:invalid{border-color:var(--bad)}
.field .src{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:-2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
table.res{width:100%;border-collapse:collapse;font-size:12px}
table.res th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:4px}
table.res td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
table.res tr[data-room]{cursor:pointer}
table.res tr[data-room]:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
.ok-t{color:var(--ok)} .warn-t{color:var(--warn)} .bad-t{color:var(--bad)}
.log{font:12px/1.5 var(--f-mono);max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.log div{display:flex;gap:8px} .log .t{color:var(--muted);min-width:56px}
details.rule{border:1px solid var(--line);border-radius:7px;padding:6px 9px;margin:6px 0;font-size:12.5px}
details.rule summary{cursor:pointer;font-weight:500}
details.rule p{margin:6px 0 0;color:var(--muted)}
ul.flat{list-style:none;margin:0;padding:0;font-size:12.5px}
ul.flat li{padding:5px 0;border-bottom:1px solid var(--line)}
ul.flat li:last-child{border-bottom:none}
.sev{font:500 10.5px/1 var(--f-mono);text-transform:uppercase;padding:2px 5px;border-radius:4px;margin-right:6px;border:1px solid currentColor}
.sev.blocker{color:var(--bad)} .sev.review{color:var(--warn)} .sev.info{color:var(--accent)}
input[type=range]{width:100%}
.layers{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
@media (max-width:900px){
  /* minmax(0,…): a plain 1fr track grows to its widest content and the page
     scrolls sideways. */
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto;height:auto;overflow-x:hidden;overflow-y:auto}
  #rail{border-left:none;border-top:1px solid var(--line);overflow:visible;min-width:0}
  .sec{padding:14px 16px}
  .field{grid-template-columns:1fr 120px}
  #hud{left:8px;right:8px;top:8px}
  .chip select{max-width:120px}
}
</style>
</head>
