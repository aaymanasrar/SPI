<title>Kindergarten Walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: full-bleed 3D stage with a docked instrument rail; stacks on phones. */
:root{
  --bg:#eceae5; --surface:#f8f7f4; --surface-2:#e4e1da; --fg:#1d2024; --muted:#646c75;
  --line:#cdc9c0; --accent:#1d4e89; --accent-ink:#ffffff;
  --scene-bg:#dedbd4; --scene-floor:#cfcbc2; --scene-wall:#8d9299; --scene-grid:#b9b4aa;
  --sys-fire:#c62d24; --sys-cctv:#c07a0f; --sys-acs:#2f6fd0; --sys-data:#1b8c62;
  --warn:#b3541e;
  --f-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --surface-2:#262b30; --fg:#e7e9ec; --muted:#98a1ab;
  --line:#333a41; --accent:#6fa8dc; --accent-ink:#0d1114;
  --scene-bg:#0f1316; --scene-floor:#232a30; --scene-wall:#5a646e; --scene-grid:#2d353c;
  --sys-fire:#ef5a50; --sys-cctv:#e0a33c; --sys-acs:#6b9fe8; --sys-data:#3cbd8c;
  --warn:#e08a4e; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --surface-2:#262b30; --fg:#e7e9ec; --muted:#98a1ab;
  --line:#333a41; --accent:#6fa8dc; --accent-ink:#0d1114;
  --scene-bg:#0f1316; --scene-floor:#232a30; --scene-wall:#5a646e; --scene-grid:#2d353c;
  --sys-fire:#ef5a50; --sys-cctv:#e0a33c; --sys-acs:#6b9fe8; --sys-data:#3cbd8c;
  --warn:#e08a4e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);
  font-size:14px;line-height:1.45;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1fr) 332px;height:100%;gap:0}
#stage{position:relative;min-width:0;background:var(--scene-bg)}
#view{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#view.walking{cursor:crosshair}
#rail{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;
  display:flex;flex-direction:column;gap:0;min-width:0}

.hd{padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 5px}
h1{font-family:var(--f-display);font-size:21px;line-height:1.15;margin:0 0 7px;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:12.5px}

.sect{padding:14px 18px;border-bottom:1px solid var(--line)}
.sect>h2{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-family:var(--f-display);font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);margin-top:3px}

.sys{display:flex;flex-direction:column;gap:2px}
.sysrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:5px;
  border:1px solid transparent;background:none;color:inherit;font:inherit;text-align:left;
  width:100%;cursor:pointer}
.sysrow:hover{background:var(--surface-2)}
.sysrow[aria-pressed="false"]{opacity:.42}
.sysrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.sysrow .nm{flex:1;min-width:0;font-size:13px}
.sysrow .ct{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.modes{display:flex;gap:6px;margin-bottom:11px}
.mode{flex:1;padding:7px 4px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);
  color:var(--fg);font:500 12px var(--f-body);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.hint kbd{font-family:var(--f-mono);font-size:10.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:3px;padding:.5px 4px}
label.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:9px;cursor:pointer}

#detail{min-height:132px}
.empty{color:var(--muted);font-size:12.5px;margin:0}
.dev-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.dev-h strong{font-family:var(--f-display);font-size:16px;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;font-size:12.5px}
dt{color:var(--muted)}
dd{margin:0;font-family:var(--f-mono);font-size:11.5px;word-break:break-word}
.cite{margin-top:10px;padding:9px 10px;background:var(--surface-2);border-left:2px solid var(--accent);
  border-radius:0 4px 4px 0;font-size:11.5px;line-height:1.4}
.cite b{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:3px}
.cite.gap{border-left-color:var(--warn)}

.flag{display:flex;gap:9px;padding:10px 11px;background:var(--surface-2);border-radius:5px;
  border-left:2px solid var(--warn);font-size:12px;line-height:1.45}
.flag .n{font-family:var(--f-mono);color:var(--warn);font-weight:500;flex:0 0 auto}
.brk{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:flex;
  flex-direction:column;gap:5px}
.brkrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding-left:8px}
.dot.sm{width:7px;height:7px}
.brkrow .n{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.tag{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);
  border-radius:3px;padding:1.5px 5px}
.cite+.cite{margin-top:7px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0}

#badge{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
#badge span{background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:3px 7px;border-radius:3px}
#walkbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:none;
  padding:12px 26px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);font:500 13px var(--f-body);cursor:pointer;user-select:none;-webkit-user-select:none}
#walkbtn.on{display:block}
@media (hover:hover) and (pointer:fine){#walkbtn.on{display:none}}

@media (max-width:860px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}
  #rail{border-left:none;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
