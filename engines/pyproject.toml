[project]
name = "spi-craft-engines"
version = "0.1.0"
description = "Headless engines that read and write the files engineers work in (.xlsx, .docx, .dxf, .pdf)"
requires-python = ">=3.11"

# LICENCE POLICY (enforced by scripts/check-licenses):
#   allowed   MIT, BSD, Apache-2.0, ISC, PSF, MPL-2.0 (MPL only as a separate process)
#   forbidden AGPL (so: no PyMuPDF), GPL shipped to the browser, HyperFormula, ODA SDK
# Every pin below is MIT, BSD or Apache-2.0. docxtpl is deliberately absent: it is
# LGPL-2.1, which is on neither list, so WordCraft does its own placeholder
# substitution with python-docx (MIT) instead. See docs/decisions/0001-craft-engines.md.
dependencies = [
  "pydantic>=2.9",        # MIT
  "fastapi>=0.115",       # MIT
  "uvicorn>=0.32",        # BSD-3-Clause
  "openpyxl>=3.1",        # MIT
  "python-docx>=1.1",     # MIT
  "ezdxf>=1.3",           # MIT
  "pdfplumber>=0.11",     # MIT        — pdf.extract
  "pypdf>=5.1",           # BSD-3-Clause — pdf.pack (merge)
  "reportlab>=4.2",       # BSD-3-Clause — pdf.pack (stamp overlay)
]
# pypdfium2 is not pinned directly: nothing imports it, and it arrives anyway
# as a dependency of pdfplumber. Do not re-add it.

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pip-licenses>=5.0",
  "httpx2>=2.15",       # BSD-3-Clause — starlette TestClient needs it
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["craft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
